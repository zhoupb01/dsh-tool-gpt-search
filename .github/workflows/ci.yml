name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v" + version) throw new Error("Tag must match package.json version");'
      - name: Pack release assets
        run: |
          npm pack
          archive="dsh-tool-gpt-search-${GITHUB_REF_NAME#v}.tgz"
          sha256sum "$archive" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dsh-tool-gpt-search-${GITHUB_REF_NAME#v}.tgz"
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
